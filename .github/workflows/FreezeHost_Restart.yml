name: FreezeHost 自动重启

on:
  workflow_dispatch:
    inputs:
      token_number:
        description: '指定 DISCORD 账号（FREEZEHOST_DISCORD_TOKEN_*）'
        required: true
        default: '1'
        type: choice
        options:
          - '1'
          - '2'
          - '3'
          - '4'
          - '5'

jobs:
  restart:
    name: 执行重启
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: write

    steps:
      - name: 确定使用哪个 Token
        id: select_token
        run: |
          TOKEN_NUM="${{ github.event.inputs.token_number }}"
          echo "token_number=$TOKEN_NUM" >> "$GITHUB_OUTPUT"
          echo "::notice::选择 Token 编号: $TOKEN_NUM"

      - name: 拉取仓库
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: |
          pip install playwright
          playwright install chromium --with-deps

      - name: 启用 WARP 网络
        uses: fscarmen/warp-on-actions@v1.3
        with:
          stack: dual
          mode: client

      - name: 修复 DNS
        run: |
          echo "[INFO] 停用 systemd-resolved，直连 DNS..."
          sudo systemctl stop systemd-resolved 2>/dev/null || true
          sudo systemctl disable systemd-resolved 2>/dev/null || true
          sudo rm -f /etc/resolv.conf
          echo -e "nameserver 1.1.1.1\nnameserver 8.8.8.8\nnameserver 1.0.0.1" | sudo tee /etc/resolv.conf
          sudo chattr +i /etc/resolv.conf 2>/dev/null || true
          sleep 2
          echo "[INFO] DNS 测试:"
          nslookup free.freezehost.pro 1.1.1.1 || echo "[WARN] 解析失败"
          echo ""
          echo "[INFO] 当前出口 IP:"
          curl -s --max-time 10 https://api.ipify.org && echo
          echo "[INFO] WARP Trace:"
          curl -s --max-time 10 https://www.cloudflare.com/cdn-cgi/trace | grep -E 'ip=|warp=|loc='

      - name: 启动 Hysteria2 节点代理
        env:
          FREEZEHOST_HYSTERIA2_URI: ${{ secrets.FREEZEHOST_HYSTERIA2_URI }}
        run: |
          set -e
          if [ -z "$FREEZEHOST_HYSTERIA2_URI" ]; then
            echo "[INFO] 未配置 Hysteria2 节点，跳过 sing-box。"
            exit 0
          fi
          echo "[INFO] 安装 sing-box..."
          SING_BOX_VERSION="1.12.8"
          curl -L -o sing-box.tar.gz "https://github.com/SagerNet/sing-box/releases/download/v${SING_BOX_VERSION}/sing-box-${SING_BOX_VERSION}-linux-amd64.tar.gz"
          tar -xzf sing-box.tar.gz
          sudo install -m 755 "sing-box-${SING_BOX_VERSION}-linux-amd64/sing-box" /usr/local/bin/sing-box

          echo "[INFO] 生成 sing-box 配置..."
          python scripts/hysteria2_to_singbox.py

          echo "[INFO] 启动本地 SOCKS 代理 127.0.0.1:10808..."
          nohup sing-box run -c sing-box-hysteria2.json > sing-box.log 2>&1 &
          echo $! > sing-box.pid
          sleep 5

          echo "[INFO] 检查代理出口 IP..."
          curl --socks5-hostname 127.0.0.1:10808 -s --max-time 20 https://api.ipify.org && echo
          echo "FREEZEHOST_PROXY_SERVER=socks5://127.0.0.1:10808" >> "$GITHUB_ENV"

      - name: 设置普通代理
        env:
          FREEZEHOST_PROXY_SERVER_SECRET: ${{ secrets.FREEZEHOST_PROXY_SERVER }}
        run: |
          if [ -n "${FREEZEHOST_PROXY_SERVER:-}" ]; then
            echo "[INFO] 已由 Hysteria2 节点设置代理。"
          elif [ -n "$FREEZEHOST_PROXY_SERVER_SECRET" ]; then
            echo "FREEZEHOST_PROXY_SERVER=$FREEZEHOST_PROXY_SERVER_SECRET" >> "$GITHUB_ENV"
            echo "[INFO] 已设置普通代理。"
          else
            echo "[INFO] 未配置普通代理。"
          fi

      - name: 设置 Discord Token
        run: |
          TOKEN_NUM="${{ steps.select_token.outputs.token_number }}"
          case "$TOKEN_NUM" in
            1) echo "FREEZEHOST_DISCORD_TOKEN=${{ secrets.FREEZEHOST_DISCORD_TOKEN_1 }}" >> "$GITHUB_ENV" ;;
            2) echo "FREEZEHOST_DISCORD_TOKEN=${{ secrets.FREEZEHOST_DISCORD_TOKEN_2 }}" >> "$GITHUB_ENV" ;;
            3) echo "FREEZEHOST_DISCORD_TOKEN=${{ secrets.FREEZEHOST_DISCORD_TOKEN_3 }}" >> "$GITHUB_ENV" ;;
            4) echo "FREEZEHOST_DISCORD_TOKEN=${{ secrets.FREEZEHOST_DISCORD_TOKEN_4 }}" >> "$GITHUB_ENV" ;;
            5) echo "FREEZEHOST_DISCORD_TOKEN=${{ secrets.FREEZEHOST_DISCORD_TOKEN_5 }}" >> "$GITHUB_ENV" ;;
            *) echo "FREEZEHOST_DISCORD_TOKEN=${{ secrets.FREEZEHOST_DISCORD_TOKEN_1 }}" >> "$GITHUB_ENV" ;;
          esac
          echo "::notice::已设置 Token 编号: $TOKEN_NUM"

      - name: 运行重启脚本
        env:
          FREEZEHOST_BASE_URL: ${{ vars.FREEZEHOST_BASE_URL || 'https://free.freezehost.pro' }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: python restart.py

#      - name: 上传截图
#        if: always()
#        uses: actions/upload-artifact@v4
#        with:
#          name: restart-screenshots-token-${{ steps.select_token.outputs.token_number }}
#          path: screenshots/
#          retention-days: 7

      - name: 清理历史运行记录
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          delete_workflow_pattern: ${{ github.workflow }}
          retain_days: 0
          keep_minimum_runs: 1
